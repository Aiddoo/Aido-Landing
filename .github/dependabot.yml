version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    labels: ["type: deps", "area: ci"]
    commit-message:
      prefix: "chore(deps)"
    # 모든 Actions 업데이트를 한 PR로 묶는다.
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    labels: ["type: deps"]
    commit-message:
      prefix: "chore(deps)"
    # @types/node 메이저는 런타임 Node 메이저(engines·CI·Vercel 모두 24)와 맞춘다.
    # Node를 올릴 때 engines·CI node-version과 함께 직접 올린다.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # 모든 npm 업데이트를 한 PR로 묶어 매달 PR 하나만 연다.
    groups:
      npm:
        patterns: ["*"]
