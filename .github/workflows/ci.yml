# CI: 보안 감사 · 린트 · 타입 · 테스트 · 정적 빌드/SEO
# 비용을 아끼려고 자동 실행하지 않는다. 검사는 머지 전에 로컬 `pnpm check`(Playwright 포함)로 돌리고,
# 이 워크플로는 로컬 환경이 없을 때만 Actions 탭에서 수동(workflow_dispatch)으로 실행한다.
# 배포(CD)는 Vercel Git 연동이 담당하며 main(Production)만 빌드한다 — vercel.json ignoreCommand 참고.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에서 다시 실행하면 앞선 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit · Review · Lint · Types · Tests · SSG · SEO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ENV: production
      VERCEL: "1"
      ANALYTICS_PROVIDERS: ga4,vercel
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TEST123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm 버전은 package.json의 packageManager 필드에서 읽는다
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 개발·간접 의존성 포함 전체 검사 (로컬 `pnpm check`에서 Playwright를 뺀 순서)
      - name: Audit known dependency vulnerabilities
        run: pnpm audit

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (analytics boundaries and provider contracts)
        run: pnpm test

      - name: Check immutable responsive assets
        run: pnpm images:check

      - name: Check update records and store copy
        run: pnpm patch-notes:check

      - name: Build
        run: pnpm build

      - name: Check rendered SEO and static routes
        run: pnpm seo:check
