<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 홈 OG 이미지(1200×630). scripts/generate-og-images.mjs가 문구를 넣고 캡처한다. -->
<style>
  @font-face { font-family: "Jua"; src: url(../../public/fonts/jua-400-site-4ec87bc556dc.woff2) format("woff2"); }
  @font-face { font-family: "Jua Latin"; src: url(../../public/fonts/jua-400-latin-f1fd08d0deef.woff2) format("woff2"); }
  @font-face { font-family: "Nanum Pen Script"; src: url(../../public/fonts/nanum-pen-script-400-site-77b4f84a787f.woff2) format("woff2"); }
  @font-face { font-family: "Nanum Pen Script Latin"; src: url(../../public/fonts/nanum-pen-script-400-latin-6cf5a669e1eb.woff2) format("woff2"); }
  @font-face { font-family: "Wanted Sans"; font-weight: 600; src: url(../../public/fonts/wanted-sans-600-site-b450f35c79d3.woff2) format("woff2"); }
  @font-face { font-family: "Wanted Sans"; font-weight: 700; src: url(../../public/fonts/wanted-sans-700-site-818b741ed1c9.woff2) format("woff2"); }
  @font-face { font-family: "Wanted Sans Latin"; font-weight: 600; src: url(../../public/fonts/wanted-sans-600-latin-c194bd4121ff.woff2) format("woff2"); }
  @font-face { font-family: "Wanted Sans Latin"; font-weight: 700; src: url(../../public/fonts/wanted-sans-700-latin-fea87fdd1159.woff2) format("woff2"); }

  :root {
    --brand: #ff6b43;
    --brand-deep: #c2410c;
    --cream: #fff8f2;
    --ink: #222;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(620px 420px at 0% 0%, #ffe9dc 0%, transparent 70%),
      var(--cream);
    font-family: "Wanted Sans", "Wanted Sans Latin", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: absolute;
    right: -140px;
    top: -70px;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: var(--brand);
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 32px;
    border-radius: 50%;
    border: 3px dashed rgb(255 248 242 / 0.5);
  }
  .cat {
    position: absolute;
    left: 730px;
    top: 170px;
    width: 500px;
    height: 500px;
    filter: drop-shadow(0 18px 24px rgb(120 40 10 / 0.25));
  }
  .motif { position: absolute; }
  .motif svg { display: block; width: 100%; height: 100%; }

  .copy { position: absolute; left: 72px; top: 92px; width: 700px; }
  .hand {
    display: inline-block;
    font-family: "Nanum Pen Script", "Nanum Pen Script Latin", cursive;
    font-size: 48px;
    line-height: 1;
    color: var(--brand-deep);
    -webkit-text-stroke: 0.8px var(--brand-deep);
    transform: rotate(-2deg);
    transform-origin: left center;
  }
  .headline {
    margin-top: 34px;
    font-family: "Jua", "Jua Latin", sans-serif;
    font-size: 84px;
    line-height: 1.18;
    letter-spacing: -1px;
    white-space: pre-line;
  }
  html[lang="en"] .headline { font-size: 60px; letter-spacing: -0.5px; }
  .headline em { font-style: normal; color: var(--brand); }
  .sub {
    margin-top: 30px;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.4;
    color: #4a4a4a;
    letter-spacing: -0.3px;
  }

  .brand {
    position: absolute;
    left: 72px;
    bottom: 54px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 700;
    font-size: 32px;
  }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--brand);
  }
  .chip {
    margin-left: 10px;
    padding: 9px 20px;
    border-radius: 999px;
    background: #fff;
    border: 2px solid var(--brand-deep);
    color: var(--brand-deep);
    font-weight: 700;
    font-size: 22px;
  }
</style>
</head>
<body>

    </defs>
  </svg>

  <div class="stage"></div>

  <!-- 크림 바탕 위: 진주황 생선 뼈와 옅은 발자국 -->
  <div class="motif" style="left:610px;top:70px;width:90px;height:45px;color:var(--brand-deep);opacity:.55;transform:rotate(-14deg)"><svg aria-hidden="true" viewBox="0 0 32 16"><use href="#fish-bone"/></svg></div>
  <div class="motif" style="left:560px;top:520px;width:76px;height:38px;color:var(--brand);opacity:.4;transform:rotate(12deg)"><svg aria-hidden="true" viewBox="0 0 32 16"><use href="#fish-bone"/></svg></div>
  <div class="motif" style="left:468px;top:540px;width:34px;height:34px;color:var(--brand);opacity:.22;transform:rotate(70deg)"><svg aria-hidden="true" viewBox="0 0 20 20"><use href="#paw"/></svg></div>
  <div class="motif" style="left:420px;top:512px;width:34px;height:34px;color:var(--brand);opacity:.3;transform:rotate(62deg)"><svg aria-hidden="true" viewBox="0 0 20 20"><use href="#paw"/></svg></div>
  <div class="motif" style="left:512px;top:508px;width:34px;height:34px;color:var(--brand);opacity:.4;transform:rotate(56deg)"><svg aria-hidden="true" viewBox="0 0 20 20"><use href="#paw"/></svg></div>

  <!-- 주황 원 위: 크림색 발자국과 생선 뼈 -->
  <div class="motif" style="left:1060px;top:90px;width:60px;height:60px;color:var(--cream);opacity:.55;transform:rotate(20deg)"><svg aria-hidden="true" viewBox="0 0 20 20"><use href="#paw"/></svg></div>
  <div class="motif" style="left:1120px;top:160px;width:44px;height:44px;color:var(--cream);opacity:.4;transform:rotate(36deg)"><svg aria-hidden="true" viewBox="0 0 20 20"><use href="#paw"/></svg></div>
  <div class="motif" style="left:790px;top:130px;width:110px;height:55px;color:var(--cream);opacity:.6;transform:rotate(-10deg)"><svg aria-hidden="true" viewBox="0 0 32 16"><use href="#fish-bone"/></svg></div>

  <img class="cat" src="../invite-share/ido-cat-hi.webp" alt="">

  <div class="copy">
    <p class="hand" data-slot="hand"></p>
    <p class="headline" data-slot="headline"></p>
    <p class="sub" data-slot="sub"></p>
  </div>

  <div class="brand">
    <span class="brand-mark"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 20 20" style="color:#fff"><use href="#check"/></svg></span>
    <span data-slot="brand"></span>
    <span class="chip" data-slot="chip"></span>
  </div>

</html>
